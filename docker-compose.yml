# Run with:  cp stack.env.example stack.env  (fill it in), then  docker compose up -d
# Optional services for project test suites:  docker compose --profile test-services up -d
#
# Deliberately absent: the Docker socket. Claude runs commands in this
# container with no approval prompts, so it must not be able to control the host.

services:
  dispatcher:
    build:
      context: .
      args:
        CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION:-stable}
        EXTRA_APT_PACKAGES: ${EXTRA_APT_PACKAGES:-}
    image: claude-dispatcher:local
    restart: unless-stopped
    env_file: stack.env
    volumes:
      - dispatcher-data:/data
      - dispatcher-workspaces:/workspaces
    mem_limit: ${DISPATCHER_MEMORY_LIMIT:-4g}
    networks: [dispatcher]
    # /healthz and /status listen on 127.0.0.1 inside the container by default.
    # To reach /status from the host, set STATUS_HOST=0.0.0.0 in stack.env and
    # uncomment:
    # ports:
    #   - "127.0.0.1:8080:8080"

  # Throwaway services for repos whose tests need them (same isolated network;
  # reach them as postgres:5432 and redis:6379).
  postgres:
    image: postgres:17
    profiles: [test-services]
    environment:
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:-postgres}
    tmpfs: [/var/lib/postgresql/data]
    networks: [dispatcher]

  redis:
    image: redis:8
    profiles: [test-services]
    networks: [dispatcher]

networks:
  # Its own bridge network: nothing else on the host shares it.
  dispatcher: {}

volumes:
  dispatcher-data: {}
  dispatcher-workspaces: {}
