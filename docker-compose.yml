# Local development stack: builds the image from this checkout.
#
#   cp .env.example .env   (fill it in; the same file `pnpm dev` reads)
#   docker compose up -d --build   # also starts Postgres + Redis for tests
#
# To deploy, use docker-compose.coolify.yml (Coolify, the default) or
# docker-compose.portainer.yml (Portainer) instead.
#
# Deliberately absent: the Docker socket. Claude runs commands in this
# container with no approval prompts, so it must not be able to control the host.

services:
  dispatcher:
    build:
      context: .
      args:
        CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION:-stable}
        EXTRA_APT_PACKAGES: ${EXTRA_APT_PACKAGES:-}
        ASDF_PRELOAD: ${ASDF_PRELOAD:-python latest:3.12 ruby latest:3.3}
        # "none" installs no plugins; see docs/plugins.md.
        CLAUDE_PLUGINS: ${CLAUDE_PLUGINS:-typescript-lsp@claude-plugins-official pyright-lsp@claude-plugins-official}
        CLAUDE_MARKETPLACES: ${CLAUDE_MARKETPLACES:-anthropics/claude-plugins-official}
    image: claude-dispatcher:local
    restart: unless-stopped
    # DISPATCHER_ENV_FILE lets scripts/dev-gitea.sh point at its own file
    # without touching your .env.
    env_file:
      - path: ${DISPATCHER_ENV_FILE:-.env}
        required: false
    # Container paths. These win over the env file, whose DATA_DIR and
    # WORKSPACE_DIR are host paths meant for `pnpm dev`.
    environment:
      DATA_DIR: /data
      WORKSPACE_DIR: /workspaces
      # The services below, which Claude is told to run the tests against.
      TEST_SERVICES: ${TEST_SERVICES-postgres://postgres:${TEST_POSTGRES_PASSWORD:-postgres}@postgres:5432,redis://redis:6379}
    volumes:
      - dispatcher-data:/data
      - dispatcher-workspaces:/workspaces
      # Language versions installed with asdf. A named volume, so Docker seeds
      # it from the image's preloaded versions on first use.
      - dispatcher-toolchains:/toolchains
    mem_limit: ${DISPATCHER_MEMORY_LIMIT:-4g}
    networks: [dispatcher]
    # /healthz, /status and the web dashboard listen on 127.0.0.1 inside the
    # container by default.
    # To open the dashboard from the host, set STATUS_HOST=0.0.0.0 in .env
    # (and DASHBOARD_TOKEN to log in) and uncomment:
    # ports:
    #   - "127.0.0.1:8080:8080"

  # Throwaway services for repos whose tests need them, reachable from the
  # dispatcher as postgres:5432 and redis:6379 (the hostnames CI service
  # containers usually get). Data lives in memory and is lost on restart.
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:-postgres}
    tmpfs: [/var/lib/postgresql/data]
    mem_limit: 512m
    networks: [dispatcher]

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    mem_limit: 256m
    networks: [dispatcher]

networks:
  # Its own bridge network: nothing else on the host shares it.
  dispatcher: {}

volumes:
  dispatcher-data: {}
  dispatcher-workspaces: {}
  dispatcher-toolchains: {}
