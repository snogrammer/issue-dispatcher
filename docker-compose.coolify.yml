# claude-dispatcher as a Coolify application deployed from this repository
# through a Gitea App source, running the image CI publishes. The default
# deployment; docker-compose.portainer.yml is the Portainer alternative.
#
# Create the resource from this repo with the Docker Compose build pack and
# this file as the compose location, then turn auto-deploy off: a push to main
# lands before CI has pushed the new image, so CI triggers the deploy itself
# through the resource's deploy webhook once the image is up (see
# deploy/coolify-deploy.sh and docs/deploy.md#coolify). Coolify lists the
# variables below in the resource's environment; coolify.env.example has a
# paste-able set.
#
# Coolify's compose validator rejects variables in volume sources and network
# names, so the host paths below and the Gitea network's name are literal. The
# dispatcher joins gitea_internal, the Gitea resource's own network, so
# GITEA_URL can be the container's name there (http://gitea:3000); the network
# must already exist on the host. Coolify's proxy routes to the dashboard: set
# the dispatcher service's domain in the UI to https://dispatcher.example.com:8080
# (the ":8080" is the container port to route to, not part of the public URL).
# No container_name, published port, network_mode, YAML anchors or extension
# blocks: Coolify manages or rejects them, so repeated settings are written out.
#
#   DISPATCHER_IMAGE         registry path, e.g. registry.example.com/org/claude-dispatcher
#   DISPATCHER_TAG           tag to run (default: latest, which CI's deploy pulls);
#                            pin v1.2.3 or a commit sha for a fixed version
#   DISPATCHER_CPUS          CPU limit (default: 2)
#   DISPATCHER_MEMORY_LIMIT  memory limit (default: 4g)
#   GITEA_URL                the Gitea instance: http://gitea:3000 over
#                            gitea_internal, or its public URL
#   TEST_POSTGRES_PASSWORD   password of the test Postgres (default: postgres)
#
# State lives in /srv/claude-dispatcher/data (SQLite) and checkouts in
# /srv/claude-dispatcher/workspaces on the host. The dispatcher runs as uid
# 10001; if Docker creates those directories (owned by root), the entrypoint
# takes ownership of them before dropping privileges. Both can be emptied:
# state is rebuilt from Gitea labels and checkouts are re-cloned.
#
# The CPU, memory and privilege limits keep a busy run from starving whatever
# else shares the host.
#
# Deliberately absent: the Docker socket. Claude runs commands in this
# container with no approval prompts, so it must not be able to control the host.

services:
  dispatcher:
    image: '${DISPATCHER_IMAGE:?}:${DISPATCHER_TAG:-latest}'
    # A deploy re-pulls the tag, so :latest moves to the image CI just pushed.
    pull_policy: always
    restart: unless-stopped
    environment:
      # Container paths, so state always lands on the bind mounts.
      - 'DATA_DIR=/data'
      - 'WORKSPACE_DIR=/workspaces'
      # Listen beyond the container's loopback, so Coolify's proxy can reach
      # /healthz, /status and the dashboard.
      - 'STATUS_HOST=0.0.0.0'
      # The test services below, which Claude is told to run the tests against.
      - 'TEST_SERVICES=postgres://postgres:${TEST_POSTGRES_PASSWORD:-postgres}@postgres:5432,redis://redis:6379'
      - 'GITEA_URL=${GITEA_URL:?}'
      - 'GITEA_TOKEN=${GITEA_TOKEN:?}'
      - 'BOT_USERNAME=${BOT_USERNAME:?}'
      - 'HUMAN_REVIEWER=${HUMAN_REVIEWER:?}'
      - 'REPOS=${REPOS:-}'
      - 'ORGS=${ORGS:-}'
      - 'MERGE_STYLE=${MERGE_STYLE:-}'
      # Claude Code auth: set one.
      - 'CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN:-}'
      - 'ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}'
      - 'POLL_INTERVAL_S=${POLL_INTERVAL_S:-}'
      - 'MAX_CONCURRENT_SESSIONS=${MAX_CONCURRENT_SESSIONS:-}'
      - 'CI_MAX_QUEUE=${CI_MAX_QUEUE:-}'
      - 'LOG_LEVEL=${LOG_LEVEL:-}'
      - 'DASHBOARD_TOKEN=${DASHBOARD_TOKEN:-}'
      - 'DASHBOARD_HOME_URL=${DASHBOARD_HOME_URL:-}'
      - 'PLAUSIBLE_SCRIPT_URL=${PLAUSIBLE_SCRIPT_URL:-}'
      - 'PLAUSIBLE_DOMAIN=${PLAUSIBLE_DOMAIN:-}'
      - 'SENTRY_DSN=${SENTRY_DSN:-}'
      - 'SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-}'
      - 'SENTRY_SERVICE_NAME=${SENTRY_SERVICE_NAME:-}'
      - 'SENTRY_INSTANCE=${SENTRY_INSTANCE:-}'
    volumes:
      - /srv/claude-dispatcher/data:/data
      - /srv/claude-dispatcher/workspaces:/workspaces
      # Language versions installed with asdf (see docs/deploy.md). A named
      # volume, not a bind mount: Docker seeds it from the image's preloaded
      # versions, and builds only work at the path they were built for.
      - toolchains:/toolchains
    # The same check as the image's HEALTHCHECK: /healthz answers 503 once the
    # poll loop stalls. Coolify shows it as the resource's health.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    cpus: '${DISPATCHER_CPUS:-2}'
    mem_limit: '${DISPATCHER_MEMORY_LIMIT:-4g}'
    # Lower CPU weight and first in line for the OOM killer, ahead of anything
    # else on the host.
    cpu_shares: 256
    oom_score_adj: 500
    # The entrypoint drops root with setpriv, which needs no new privileges.
    security_opt:
      - no-new-privileges:true
    networks:
      - default
      - gitea
      - test-services
    # Time for SIGTERM handling to stop in-flight Claude runs cleanly.
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

  # Throwaway services for repos whose tests need them, reachable from the
  # dispatcher as postgres:5432 and redis:6379 (the hostnames CI service
  # containers usually get). Data lives in memory and is lost on restart.
  # Named dispatcher-* so they're easy to tell apart from (and exclude from
  # backups of) real databases on the host; they're only on the private
  # test-services network, where the aliases can't shadow anything else.
  dispatcher-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      - 'POSTGRES_PASSWORD=${TEST_POSTGRES_PASSWORD:-postgres}'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres']
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    mem_limit: 512m
    networks:
      test-services:
        aliases:
          - postgres

  dispatcher-redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 5
    mem_limit: 256m
    networks:
      test-services:
        aliases:
          - redis

volumes:
  toolchains: {}

networks:
  # Gitea's own resource network on Coolify, so GITEA_URL can be the Gitea
  # container's name (http://gitea:3000). Only the dispatcher joins it: the
  # test services' postgres/redis aliases must not land next to Gitea's real
  # database. The name is literal because Coolify rejects a variable here; if
  # your Gitea network is named differently, change this one line.
  gitea:
    name: gitea_internal
    external: true
  # Private to this resource: the dispatcher and its test services.
  test-services: {}
