name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # A single job on purpose: the Actions runner allows only a few concurrent
  # jobs, and the dispatcher itself opens PRs, so CI must stay cheap.
  # setup-node has no `cache:` because runners without an Actions cache
  # backend hang on the post-step cache save.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install dependencies
        run: corepack enable && pnpm install --frozen-lockfile
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
      - name: Lint
        run: pnpm lint
      - name: Format check
        run: pnpm format:check
      - name: Type check
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
