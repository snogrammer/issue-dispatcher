name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ gitea.workflow }}-${{ gitea.event_name }}-${{ gitea.ref }}
  cancel-in-progress: ${{ gitea.ref != 'refs/heads/main' }}

jobs:
  # A single job on purpose: the Actions runner allows only a few concurrent
  # jobs, and the dispatcher itself opens PRs, so CI must stay cheap.
  # setup-node has no `cache:` because runners without an Actions cache
  # backend hang on the post-step cache save.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so the secret scan covers every commit.
          fetch-depth: 0
      - name: Secret scan
        run: |
          curl -fsSL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks && rm gitleaks.tgz
          ./gitleaks git --redact --no-banner --exit-code 1 .
          rm gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install dependencies
        run: corepack enable && pnpm install --frozen-lockfile
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
      - name: Lint
        run: pnpm lint
      - name: Format check
        run: pnpm format:check
      - name: Type check
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
